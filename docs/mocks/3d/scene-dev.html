<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scene.js 動作確認</title>
<!--
  js/mountain/scene.js だけを読み込み、API をボタンで試す確認用ページ（本番のページではありません）。
  リポジトリのルートで `python3 -m http.server 8000` を起動し、
    http://localhost:8000/docs/mocks/3d/scene-dev.html
  ?form=pyramid&camera=pyramid-front&cut=2025&hl=dankai,postwar&anim=0&rm=1&fixture=1 で初期状態を指定できる。
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif;color:#222;background:#fff}
  body{display:flex;flex-direction:column}
  #wrap{position:relative;flex:1;min-height:0}
  #mountain-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #panel{font-size:12px;padding:6px 8px;border-top:1px solid #ddd;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:#fafafa}
  #panel fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
  #panel legend{float:left;margin-right:4px;color:#666}
  button{font:inherit;padding:2px 6px}
  button[aria-pressed="true"]{background:#3e6593;color:#fff;border-color:#3e6593}
  #log{position:absolute;right:8px;top:8px;font-size:12px;background:rgba(255,255,255,.92);border:1px solid #ccc;border-radius:4px;padding:4px 8px;max-width:360px;white-space:pre-wrap}
  #state{color:#555}
</style>
</head>
<body>
<div id="wrap"><canvas id="mountain-canvas"></canvas><div id="log">pick: -</div></div>
<div id="panel">
  <fieldset id="forms"><legend>形</legend></fieldset>
  <fieldset id="cams"><legend>カメラ</legend></fieldset>
  <fieldset><legend>断面</legend><input id="cut" type="range" min="1920" max="2025" value="2025"><output id="cutv">なし</output><button id="cutoff">解除</button></fieldset>
  <fieldset id="hls"><legend>強調</legend></fieldset>
  <fieldset><legend>他</legend><label><input type="checkbox" id="anim" checked>アニメ</label><label><input type="checkbox" id="orbit">オービット</label><button id="dispose">dispose</button></fieldset>
  <span id="state"></span>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import { createMountain, FORMS, CAMERA_PRESETS, COHORT_IDS } from '../../../js/mountain/scene.js';

const q = new URLSearchParams(location.search);
const url = q.get('fixture') ? '../../../tests/fixtures/pyramid.fixture.json' : '../../../data/pyramid.json';
const data = await (await fetch(url)).json();
const canvas = document.getElementById('mountain-canvas');
const scene = createMountain({ canvas, data, reducedMotion: q.get('rm') === '1' });
window.__mountain = { scene, data };

const wrap = document.getElementById('wrap');
new ResizeObserver(() => scene.resize(wrap.clientWidth, wrap.clientHeight)).observe(wrap);
scene.resize(wrap.clientWidth, wrap.clientHeight);

const anim = () => document.getElementById('anim').checked;
const stateEl = document.getElementById('state');
function refresh() {
  const s = scene.getState();
  stateEl.textContent = JSON.stringify(s);
  document.querySelectorAll('[data-form]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.form === s.form)));
  document.querySelectorAll('[data-cam]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cam === s.camera)));
  document.querySelectorAll('[data-hl]').forEach(b => b.setAttribute('aria-pressed', String(s.highlight.includes(b.dataset.hl))));
  document.getElementById('cutv').textContent = s.cutYear ?? 'なし';
}
const mk = (parent, label, attrs, fn) => { const b = document.createElement('button'); b.textContent = label; Object.assign(b.dataset, attrs); b.onclick = () => { fn(); refresh(); }; document.getElementById(parent).appendChild(b); };
FORMS.forEach(f => mk('forms', f, { form: f }, () => scene.setForm(f, { animate: anim() })));
CAMERA_PRESETS.forEach(c => mk('cams', c, { cam: c }, () => scene.setCamera(c, { animate: anim() })));
COHORT_IDS.forEach(id => mk('hls', id, { hl: id }, () => {
  const h = scene.getState().highlight; scene.setHighlight(h.includes(id) ? h.filter(x => x !== id) : [...h, id]);
}));
const cut = document.getElementById('cut');
cut.oninput = () => { scene.setCutYear(+cut.value); refresh(); };
document.getElementById('cutoff').onclick = () => { scene.setCutYear(null); refresh(); };
document.getElementById('orbit').onchange = e => scene.setOrbit(e.target.checked);
document.getElementById('dispose').onclick = () => scene.dispose();
const log = document.getElementById('log');
scene.onPick((r, info) => {
  window.__lastPick = r;
  log.textContent = r ? `${info.type}: ${r.birthYear}年生まれ ${r.sex === 'male' ? '男性' : '女性'}\n${r.year}年 ${r.age}歳${r.kazoe ? '（数え年）' : ''} ${r.value.toLocaleString()}人 [${r.source}${r.cohort ? ' / ' + r.cohort : ''}]` : 'pick: -';
});

// URL で初期状態
const a = q.get('anim') !== '0' ? undefined : { animate: false };
if (q.get('hl')) scene.setHighlight(q.get('hl') === 'none' ? [] : q.get('hl').split(','));
if (q.get('cut')) scene.setCutYear(+q.get('cut'));
if (q.get('form')) scene.setForm(q.get('form'), a ?? { animate: false });
if (q.get('camera')) scene.setCamera(q.get('camera'), a ?? { animate: false });
refresh();
requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
</script>
</body>
</html>
